name: Release

# Tag-triggered: pushing a v*.*.* tag publishes multi-arch images to
# ghcr.io and creates a GitHub Release with notes auto-generated since
# the previous tag.
#
# workflow_dispatch is for validation: with dry_run=true (the default
# when triggered manually) the build runs but nothing is pushed or
# released. Use this to confirm a workflow change compiles before
# trusting it on a real tag.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading 'v', e.g. 0.0.0). Dispatch is for dry-run validation only."
        required: true
        default: '0.0.0'
      dry_run:
        description: "Build but do NOT push to GHCR and do NOT create a Release."
        type: boolean
        default: true

permissions:
  contents: write   # softprops/action-gh-release
  packages: write   # docker push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute version, prerelease flag, image name
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # SemVer prerelease has a '-' or '+' suffix.
          case "$VERSION" in
            *-*|*+*) PRERELEASE=true ;;
            *)       PRERELEASE=false ;;
          esac
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "image=ghcr.io/$REPO_LC"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$VERSION (prerelease=$PRERELEASE) to ghcr.io/$REPO_LC"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip on dry-run dispatch — no need to authenticate when we're not pushing.
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          set -euo pipefail
          TAGS="${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.prerelease }}" = "false" ]; then
            TAGS="$TAGS,${{ steps.meta.outputs.image }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "::notice::Tags: $TAGS"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
