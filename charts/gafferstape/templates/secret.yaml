{{- if and .Values.tokens.create (not .Values.tokens.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gafferstape.fullname" . }}
  labels:
    {{- include "gafferstape.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-token: {{ required "tokens.session is required when tokens.create=true (or set tokens.existingSecret instead)" .Values.tokens.session | quote }}
  csrf-token: {{ required "tokens.csrf is required when tokens.create=true (or set tokens.existingSecret instead)" .Values.tokens.csrf | quote }}
{{- end }}
