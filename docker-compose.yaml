services:
  gafferstape:
    # Default to the published multi-arch image. To build from source
    # instead — useful when you're hacking on the code in this repo —
    # run: docker compose up -d --build
    # That rebuilds locally and overwrites the same tag with your
    # working-tree changes.
    image: ghcr.io/dev-dull/gafferstape:latest
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    container_name: gafferstape
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      # Read-only mount of your edited config. The example committed to
      # the repo is config.example.yaml — copy it to config.yaml first.
      # The daemon re-reads token fields from this file on every
      # upstream request, so editing here picks up new cookies without
      # a container restart.
      - ./config.yaml:/etc/gafferstape/config.yaml:ro
    environment:
      # Optional env-var path: if config.yaml's cookie fields are empty,
      # these are used as fallback. The file path supports hot-reload;
      # env vars are baked in at container start. See docs/setup.md §2.
      GAFFERSTAPE_SESSION_TOKEN: "${GAFFERSTAPE_SESSION_TOKEN:-}"
      GAFFERSTAPE_CSRF_TOKEN: "${GAFFERSTAPE_CSRF_TOKEN:-}"
    healthcheck:
      # Inherited from the Dockerfile, restated here so `docker compose
      # ps` shows the configured interval explicitly.
      test: ["CMD", "/gaf-exporter", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
